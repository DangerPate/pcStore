{% extends 'main/layout.html' %}
{% load static %}

{% block title %}{{ title }} - pcStore{% endblock %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card border-0 ">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 fw-bold mb-4 text-center">{{ title }}</h1>
                    
                    <div class=" mb-4">
                        <p>Здесь будет размещён контент страницы «{{ title }}».</p>
                        <p>Отредактируйте этот файл, чтобы добавить текст.</p>
                    </div>
                    
                    <div class="text-center">
                        <a href="{% url 'home' %}" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-left me-1"></i> На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
