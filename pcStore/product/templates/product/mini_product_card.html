{% load static %}
<div class="col">
  <div class="card h-100 shadow border-0 position-relative product-card">
    <!--Изображение-->
    <div class="position-relative bg-light" style="height: 220px;">
      {% if product.image %}
        <a href="#" class="d-block h-100 w-100" onclick="alert('Страница товара: {{ product.title }}'); return false;">
          <img src="{{ product.image.url }}"
               alt="{{ product.title }}"
               class="w-100 h-100"
               style="object-fit: contain; padding: 12px;"
               loading="lazy">
        </a>
      {% else %}
        <div class="d-flex align-items-center justify-content-center h-100 text-muted">
          <i class="bi bi-box-seam fs-1"></i>
        </div>
      {% endif %}
    </div>

    <!--Название-->
    <div class="card-body d-flex flex-column p-3">
      <h6 class="card-title mb-2" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; height: 4.2em;">
        <a href="{% url 'catalog:product_detail' product.slug %}" class="text-decoration-none text-dark stretched-link">
          {{ product.title }}
        </a>
      </h6>

      <!--Цена-->
      <div class="fw-bold text-primary fs-5 mb-3">
        {{ product.price }} ₽
      </div>

      <!--Кнопки-->
      <div class="mt-auto d-flex gap-2 position-relative" style="z-index: 2;">
          {% if product.is_in_cart %}
          <button type="button" class="btn btn-success btn-sm flex-grow-1 btn-add-cart" data-slug="{{ product.slug }}">
              <i class="bi bi-check-lg me-1"></i> В корзине
          </button>
          {% else %}
          <button type="button" class="btn btn-dark btn-sm flex-grow-1 btn-add-cart" data-slug="{{ product.slug }}">
              <i class="bi bi-cart-plus me-1"></i> Купить
          </button>
          {% endif %}

          <button type="button" class="btn btn-outline-danger btn-sm btn-toggle-fav {% if product.is_favorited %}active{% endif %}" data-slug="{{ product.slug }}">
              <i class="bi {% if product.is_favorited %}bi-heart-fill{% else %}bi-heart{% endif %}"></i>
          </button>
      </div>
    </div>
  </div>
</div>
