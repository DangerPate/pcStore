<div class="modal-header">
    <h5 class="modal-title">Редактирование отзыва</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<form method="post" action="{% url 'catalog:edit_review' review.id %}">
    {% csrf_token %}
    <div class="modal-body">
        <input type="hidden" name="rating" value="{{ review.rating }}">
        <div class="mb-3"><textarea name="pros" class="form-control" rows="2" placeholder="Достоинства">{{ review.pros }}</textarea></div>
        <div class="mb-3"><textarea name="cons" class="form-control" rows="2" placeholder="Недостатки">{{ review.cons }}</textarea></div>
        <div class="mb-3"><textarea name="comment" class="form-control" rows="3" placeholder="Комментарий" required>{{ review.comment }}</textarea></div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="has_issue" id="editHasIssue" {% if review.has_issue %}checked{% endif %}>
            <label class="form-check-label" for="editHasIssue">Несоответствие описанию</label>
        </div>
        <textarea name="issue_description" class="form-control form-control-sm mb-2" rows="2" {% if not review.has_issue %}style="display:none"{% endif %}>{{ review.issue_description }}</textarea>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </div>
</form>
<script>
document.getElementById('editHasIssue').addEventListener('change', function() {
    this.nextElementSibling.style.display = this.checked ? 'block' : 'none';
});
</script>
